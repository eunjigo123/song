<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인정보처리방침 | SONGSHTORY</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --primary-color: #FFA552;
            --accent-color: #FF865E;
            --deep-color: #2F4858;
            --bg-light: #FFF7EF;
            --bg-base: #FFFFFF;
            --text-sub: #5A6E7C;
            --border-color: #F1E6DC;

            --font-title: 'Noto Serif KR', serif;
            --font-body: 'Pretendard', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--deep-color);
            background: var(--bg-base);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .header {
            height: 75px;
            display: flex;
            align-items: center;
            padding: 0 60px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }

        .header img {
            height: 40px;
            width: auto;
            display: block;
        }

        .page {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            background: var(--bg-light);
        }

        .content {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .label {
            display: block;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--primary-color);
        }

        h1 {
            font-family: var(--font-title);
            font-size: 44px;
            line-height: 1.25;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .description {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-sub);
            margin-bottom: 40px;
        }

        .ready-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 50px 30px;
            margin-bottom: 35px;
        }

        .ready-box h2 {
            font-family: var(--font-title);
            font-size: 28px;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .ready-box p {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-sub);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            height: 52px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }
    </style>
</head>

<body>

<header class="header">
    <a href="index.html">
        <img src="logo.png" alt="SONGSHTORY 로고">
    </a>
</header>

<main class="page">

    <div class="content">

        <span class="label">PRIVACY POLICY</span>

        <h1>개인정보처리방침</h1>

        <p class="description">
            SONGSHTORY의 개인정보 처리 기준을 안내하는 페이지입니다.
        </p>

        <div class="ready-box">
            <h2>페이지 준비중입니다.</h2>

            <p>
                개인정보처리방침 내용을 정리하고 있습니다.<br>
                준비가 완료되는 대로 안내해 드리겠습니다.
            </p>
        </div>

        <a href="index.html" class="back-btn">
            메인으로 돌아가기
        </a>

    </div>

</main>

</body>
</html>
