name: One-time about header sync

on:
  push:
    paths:
      - '.github/workflows/sync-headers-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync headers from about.html
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          source = (root / 'about.html').read_text(encoding='utf-8')

          # Exact desktop/mobile header CSS from about.html.
          css_start = source.index('/* Header (Sticky & Blur) */')
          css_end = source.index('/* 애니메이션 클래스 */', css_start)
          header_css = source[css_start:css_end].rstrip()

          # about.html relies on browser defaults that some other pages reset with * rules.
          # Re-apply those defaults only inside the header so the rendered coordinates match about.html.
          header_css += r'''

    /* about.html header baseline: neutralize page-level universal resets */
    header, header * {
        box-sizing: content-box;
    }
    header .nav-menu {
        padding-left: 40px;
        padding-right: 0;
        margin-top: 1em;
        margin-bottom: 1em;
    }
'''

          # Exact desktop header HTML from about.html.
          h1 = source.index('<!-- Header -->')
          h2 = source.index('<!-- Mobile Drawer Menu & Overlay -->', h1)
          desktop_header = source[h1:h2].rstrip()

          targets = [
              'index.html',
              'contact.html',
              'project.html',
              'creator.html',
              'ecommerce.html',
              'global-sourcing.html',
          ]

          for name in targets:
              p = root / name
              if not p.exists():
                  print(f'skip missing: {name}')
                  continue
              text = p.read_text(encoding='utf-8')

              # Remove an older sync block if this script is ever rerun.
              text = re.sub(
                  r'\n?\s*<style id="about-header-sync">.*?</style>\s*',
                  '\n', text, flags=re.S
              )

              # Place the about header CSS last in <head>, so page-specific header CSS cannot override it.
              sync_style = '\n    <style id="about-header-sync">\n' + header_css + '\n    </style>\n'
              text = text.replace('</head>', sync_style + '</head>', 1)

              # Replace only the desktop header HTML with the exact about.html block.
              if '<header id="header">' in text:
                  text = re.sub(
                      r'\s*(?:<!--\s*Header[^>]*-->\s*)?<header id="header">.*?</header>',
                      '\n\n    ' + desktop_header,
                      text,
                      count=1,
                      flags=re.S,
                  )
              else:
                  text = text.replace('<body>', '<body>\n\n    ' + desktop_header, 1)

              p.write_text(text, encoding='utf-8')
              print(f'synced: {name}')

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/sync-headers-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync all page headers to about.html"
          git push
