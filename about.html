<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 배너 슬라이드</title>
    <style>
        /* 배너 컨테이너 스타일 */
        .banner-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 8px;
        }

        /* 슬라이드 이미지 기본 스타일 (페이드 효과) */
        .banner-slide {
            display: none;
            width: 100%;
            height: auto;
            object-fit: cover;
            animation: fadeEffect 1s ease-in-out;
        }

        /* 활성화된 슬라이드 표시 */
        .banner-slide.active {
            display: block;
        }

        @keyframes fadeEffect {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* 이전/다음 버튼 스타일 */
        .banner-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 12px 16px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 4px;
            z-index: 10;
        }

        .banner-btn.prev { left: 15px; }
        .banner-btn.next { right: 15px; }

        .banner-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* 하단 인디케이터(점) 스타일 */
        .banner-dots {
            text-align: center;
            position: absolute;
            bottom: 15px;
            width: 100%;
            z-index: 10;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin: 0 5px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- 이미지 9개 슬라이드 영역 -->
        <img src="home_image_01.png" alt="메인 배너 이미지 1" class="banner-slide active">
        <img src="home_image_02.png" alt="메인 배너 이미지 2" class="banner-slide">
        <img src="home_image_03.png" alt="메인 배너 이미지 3" class="banner-slide">
        <img src="home_image_04.png" alt="메인 배너 이미지 4" class="banner-slide">
        <img src="home_image_05.png" alt="메인 배너 이미지 5" class="banner-slide">
        <img src="home_image_06.png" alt="메인 배너 이미지 6" class="banner-slide">
        <img src="home_image_07.png" alt="메인 배너 이미지 7" class="banner-slide">
        <img src="home_image_08.png" alt="메인 배너 이미지 8" class="banner-slide">
        <img src="home_image_09.png" alt="메인 배너 이미지 9" class="banner-slide">

        <!-- 좌우 이동 버튼 -->
        <button class="banner-btn prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="banner-btn next" onclick="moveSlide(1)">&#10095;</button>

        <!-- 하단 인디케이터 -->
        <div class="banner-dots">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
            <span class="dot" onclick="currentSlide(6)"></span>
            <span class="dot" onclick="currentSlide(7)"></span>
            <span class="dot" onclick="currentSlide(8)"></span>
            <span class="dot" onclick="currentSlide(9)"></span>
        </div>
    </div>

    <script>
        let slideIndex = 0;
        let slideInterval;
        const slides = document.querySelectorAll(".banner-slide");
        const dots = document.querySelectorAll(".dot");

        function showSlides() {
            slides.forEach((slide, index) => {
                slide.classList.remove("active");
                dots[index].classList.remove("active");
            });

            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }

            slides[slideIndex - 1].classList.add("active");
            dots[slideIndex - 1].classList.add("active");
        }

        // 자동 슬라이드 시작 (4.5초 간격)
        function startAutoSlide() {
            slideInterval = setInterval(showSlides, 4500);
        }

        function stopAutoSlide() {
            clearInterval(slideInterval);
        }

        // 수동 버튼 조작
        function moveSlide(n) {
            stopAutoSlide();
            slides[slideIndex - 1].classList.remove("active");
            dots[slideIndex - 1].classList.remove("active");

            slideIndex += n;
            if (slideIndex > slides.length) { slideIndex = 1; }
            if (slideIndex < 1) { slideIndex = slides.length; }

            slides[slideIndex - 1].classList.add("active");
            dots[slideIndex - 1].classList.add("active");
            startAutoSlide();
        }

        function currentSlide(n) {
            stopAutoSlide();
            slides[slideIndex - 1].classList.remove("active");
            dots[slideIndex - 1].classList.remove("active");

            slideIndex = n;

            slides[slideIndex - 1].classList.add("active");
            dots[slideIndex - 1].classList.add("active");
            startAutoSlide();
        }

        // 초기 실행
        dots[0].classList.add("active");
        startAutoSlide();
    </script>

</body>
</html>
